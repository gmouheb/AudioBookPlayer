# Builds the Narrate APK and publishes it to the "apk" release, so the phone can
# always download the latest build from:
#   https://github.com/<you>/<repo>/releases/download/apk/narrate.apk
#
# Signing secrets (Settings → Secrets and variables → Actions):
#   NARRATE_KEYSTORE_BASE64, NARRATE_KEYSTORE_PASSWORD, NARRATE_KEY_ALIAS, NARRATE_KEY_PASSWORD
# Without them the APK is signed with a throwaway debug key (updates then need an uninstall).
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write # to publish the release

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Copy web app into the Android project
        run: npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NARRATE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/narrate-release.jks"
            echo "NARRATE_KEYSTORE=$RUNNER_TEMP/narrate-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set; building with a debug key."
          fi

      - name: Build APK
        working-directory: app/android
        env:
          NARRATE_KEYSTORE_PASSWORD: ${{ secrets.NARRATE_KEYSTORE_PASSWORD }}
          NARRATE_KEY_ALIAS: ${{ secrets.NARRATE_KEY_ALIAS }}
          NARRATE_KEY_PASSWORD: ${{ secrets.NARRATE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/narrate.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: narrate-apk-${{ github.run_number }}
          path: ${{ runner.temp }}/narrate.apk
          retention-days: 14

      - name: Publish to the "apk" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Build #${{ github.run_number }} from ${GITHUB_SHA::7}. Install narrate.apk on the phone."
          gh release view apk >/dev/null 2>&1 \
            || gh release create apk --title "Narrate APK (latest build)" --notes "$NOTES"
          gh release edit apk --notes "$NOTES"
          gh release upload apk "$RUNNER_TEMP/narrate.apk" --clobber
