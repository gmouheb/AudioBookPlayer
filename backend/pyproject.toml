[project]
name = "narrate"
version = "0.1.0"
description = "Narrate: personal audiobook server (EPUB/PDF -> Kokoro TTS)"
readme = "README.md"
authors = [
    { name = "gmouheb", email = "ghabrimouheb@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm",
    "fastapi>=0.165.0",
    "kokoro>=0.9.4",
    "lxml>=6.1.3",
    "pypdfium2>=5.15.2",
    "python-multipart>=0.0.34",
    "soundfile>=0.14.0",
    "torch>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
narrate = "narrate.main:run"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
